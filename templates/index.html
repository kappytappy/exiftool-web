<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExifTool Web UI</title>
<style>
  :root{
    --bg:#0d1017; --panel:#141a24; --panel2:#1a2230; --border:#26303f;
    --text:#e9edf3; --muted:#8d96a5; --accent:#7aa2ff; --accent2:#a37bff;
    --danger:#ff8080; --ok:#5fd68a; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1100px 500px at 15% -10%, #182435 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #1c1830 0%, transparent 55%),
      var(--bg);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .hidden{display:none !important}

  /* ---------- header ---------- */
  header{
    flex:0 0 54px; display:flex; align-items:center; gap:10px; padding:0 20px;
    border-bottom:1px solid var(--border); background:rgba(13,16,23,.7);
    backdrop-filter:blur(8px); z-index:5;
  }
  .dot{width:11px;height:11px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 12px rgba(122,162,255,.7)}
  .brand{font-weight:700;font-size:15px;letter-spacing:.2px}
  .tagline{color:var(--muted);font-size:12.5px;margin-left:2px}
  #ver{margin-left:auto;font-size:12px;color:var(--muted);
    border:1px solid var(--border);border-radius:999px;padding:3px 10px;background:var(--panel)}

  /* ---------- toast ---------- */
  #toast{
    position:fixed; top:66px; left:50%; transform:translateX(-50%) translateY(-8px);
    padding:9px 18px; border-radius:999px; font-size:13px; font-weight:600;
    background:var(--panel2); border:1px solid var(--border); z-index:50;
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    box-shadow:0 8px 30px rgba(0,0,0,.45); max-width:90vw;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  #toast.ok{border-color:#1e4d33; color:var(--ok)}
  #toast.err{border-color:#5a2323; color:var(--danger)}
  #toast.info{color:var(--accent)}
  #copied{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--panel2); border:1px solid var(--border); color:var(--ok);
    font-size:12.5px; font-weight:600; padding:7px 16px; border-radius:999px;
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:50;
  }
  #copied.show{opacity:1}

  main{flex:1; min-height:0; display:flex; flex-direction:column}

  /* ---------- empty state ---------- */
  #empty{flex:1; display:flex; align-items:center; justify-content:center; padding:32px}
  #drop{
    width:min(560px,92vw); border:1.5px dashed #35415a; border-radius:20px;
    padding:64px 32px; text-align:center; cursor:pointer; background:rgba(20,26,36,.6);
    transition:border-color .2s, transform .2s, background .2s;
  }
  #drop:hover,#drop.over{border-color:var(--accent); background:rgba(28,36,52,.7); transform:translateY(-2px)}
  #drop input{display:none}
  #drop .icon{font-size:44px; margin-bottom:10px}
  #drop strong{font-size:17px}
  #drop p{color:var(--muted); font-size:13px; margin:8px 0 0}

  /* ---------- app: dropbar + filename + two boxes ---------- */
  #app{flex:1; min-height:0; display:flex; flex-direction:column; gap:12px; padding:14px 18px 16px}
  #dropbar{
    flex:0 0 auto; border:1.5px dashed #35415a; border-radius:12px;
    padding:12px; text-align:center; cursor:pointer; color:var(--muted); font-size:13px;
    background:rgba(20,26,36,.5); transition:border-color .2s, background .2s;
  }
  #dropbar:hover,#dropbar.over{border-color:var(--accent); color:var(--text); background:rgba(28,36,52,.6)}
  #dropbar strong{color:var(--text)}
  #filebar{flex:0 0 auto; display:flex; align-items:center; gap:12px}
  #preview{width:52px; height:52px; border-radius:10px; object-fit:cover; border:1px solid var(--border); flex:0 0 auto}
  .fileinfo{min-width:0}
  .fname{font-weight:700; font-size:14px; word-break:break-all}
  .fmeta{color:var(--muted); font-size:12.5px}
  #newfile{margin-left:auto; flex:0 0 auto}

  #boxes{flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .box{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    display:flex; flex-direction:column; min-height:0; min-width:0; overflow:hidden;
  }
  .boxhead{flex:0 0 auto; padding:14px 16px 12px; border-bottom:1px solid var(--border)}
  .boxhead h2{margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted)}
  .boxbody{flex:1; min-height:0; overflow-y:auto; padding:12px 16px 16px}

  #search{
    width:100%; padding:9px 13px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:13.5px; margin-bottom:10px;
  }
  #search:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(122,162,255,.15)}
  .topline{display:flex; align-items:center; gap:10px; margin-bottom:10px}
  .topline h2{margin:0}
  #tagcount{margin-left:auto; color:var(--muted); font-size:12.5px; white-space:nowrap; text-transform:none; letter-spacing:0}
  #tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:thin}

  .trow{
    display:grid; grid-template-columns:minmax(150px,220px) 1fr; gap:12px;
    padding:8px 10px; border-radius:9px; font-size:13px; cursor:pointer;
    border-bottom:1px solid rgba(38,48,63,.5);
  }
  .trow:hover{background:rgba(122,162,255,.06)}
  .trow .k{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px;
    color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .trow .k b{color:var(--accent); font-weight:600}
  .trow .v{word-break:break-word; color:var(--text)}
  .trow .v.empty{color:var(--muted); font-style:italic}
  .none{color:var(--muted); text-align:center; padding:40px 0; font-size:13.5px}

  .grid{display:grid; grid-template-columns:1fr; gap:10px}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .field label{display:block; color:var(--muted); font-size:12px; margin-bottom:4px}
  .field input{
    width:100%; padding:9px 11px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:13.5px;
  }
  .field input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(122,162,255,.15)}
  .actions{display:flex; gap:10px; margin-top:14px}
  .actions button{flex:1}

  button{
    background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#0c1220;
    border:0; border-radius:10px; padding:10px 16px; font-size:13.5px; font-weight:700; cursor:pointer;
    transition:transform .12s, filter .12s;
  }
  button:hover{filter:brightness(1.08)}
  button:active{transform:scale(.98)}
  button.ghost{background:transparent; color:var(--text); border:1px solid var(--border); font-weight:600}
  button.ghost:hover{border-color:var(--accent)}
  button.danger{background:transparent; color:var(--danger); border:1px solid #5a2b2b; font-weight:600}
  button.danger:hover{border-color:var(--danger); background:rgba(255,128,128,.06)}
  button:disabled{opacity:.5; cursor:default; transform:none}
  .tab{
    flex:0 0 auto; background:transparent; color:var(--muted); border:1px solid var(--border);
    border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600;
  }
  .tab span{opacity:.65; font-weight:400; margin-left:4px}
  .tab.on{background:rgba(122,162,255,.14); color:var(--text); border-color:var(--accent)}
  .tab:hover{color:var(--text)}

  @media (max-width:820px){
    body{overflow:auto}
    #app{overflow:visible}
    #boxes{grid-template-columns:1fr; overflow:visible}
    .box{min-height:50vh}
    .trow{grid-template-columns:1fr; gap:2px}
  }
</style>
</head>
<body>
<header>
  <div class="dot"></div>
  <div class="brand">ExifTool Web UI</div>
  <div class="tagline">photo metadata, on your machine</div>
  <div id="ver" class="hidden"></div>
</header>

<div id="toast" class="hidden"></div>
<div id="copied">Copied ✓</div>

<main>
  <!-- empty state -->
  <div id="empty">
    <div id="drop">
      <input type="file" id="fileinput">
      <div class="icon">🖼️</div>
      <div><strong>Drop a photo or file here</strong></div>
      <p>or click to browse — read, edit &amp; strip metadata</p>
    </div>
  </div>

  <!-- app -->
  <div id="app" class="hidden">
    <div id="dropbar"><strong>Drop a photo or file here</strong> — or click to choose a different one</div>

    <div id="filebar">
      <img id="preview" class="hidden" alt="">
      <div class="fileinfo">
        <div class="fname" id="filename"></div>
        <div class="fmeta" id="filemeta"></div>
      </div>
      <button class="ghost" id="newfile">Different file</button>
    </div>

    <div id="boxes">
      <div class="box">
        <div class="boxhead">
          <div class="topline"><h2>All metadata</h2><span id="tagcount"></span></div>
          <input id="search" placeholder="Filter tags… (e.g. gps, copyright, date)">
          <div id="tabs"></div>
        </div>
        <div class="boxbody" id="taglist"></div>
      </div>

      <div class="box">
        <div class="boxhead"><h2>Edit metadata</h2></div>
        <div class="boxbody">
          <div class="grid">
            <div class="field"><label>Title</label><input data-field="title" placeholder="Title"></div>
            <div class="field"><label>Description</label><input data-field="description" placeholder="Description / caption"></div>
            <div class="field"><label>Author</label><input data-field="author" placeholder="Author / artist"></div>
            <div class="field"><label>Copyright</label><input data-field="copyright" placeholder="Copyright notice"></div>
            <div class="field"><label>Keywords</label><input data-field="keywords" placeholder="Comma separated"></div>
            <div class="field"><label>Date taken</label><input data-field="date_taken" type="datetime-local"></div>
            <div class="grid2">
              <div class="field"><label>Latitude</label><input data-field="latitude" inputmode="decimal" placeholder="41.8781"></div>
              <div class="field"><label>Longitude</label><input data-field="longitude" inputmode="decimal" placeholder="-87.6298"></div>
            </div>
          </div>
          <div class="actions">
            <button id="save">Save &amp; download</button>
            <button id="strip" class="danger">Strip all</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let currentFile = null;
let allTags = {};
let groups = {};
let activeTab = "All";
let renderedRows = [];
let previewURL = null;
let toastTimer = null;

const PREFILL = {
  title:       ["XMP:Title", "IPTC:ObjectName"],
  description: ["EXIF:ImageDescription", "XMP:Description", "IPTC:Caption-Abstract"],
  author:      ["EXIF:Artist", "XMP:Creator", "IPTC:By-line"],
  copyright:   ["EXIF:Copyright", "XMP:Rights", "IPTC:CopyrightNotice"],
  keywords:    ["IPTC:Keywords", "XMP:Subject"],
  date_taken:  ["EXIF:DateTimeOriginal", "EXIF:CreateDate"],
  latitude:    ["EXIF:GPSLatitude"],
  longitude:   ["EXIF:GPSLongitude"],
};

function toast(msg, kind) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "show " + (kind || "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2600);
}

function setBusy(b) {
  ["save","strip"].forEach(id => $(id).disabled = b);
}

function buildGroups() {
  groups = {};
  for (const [tag, val] of Object.entries(allTags)) {
    const g = tag.includes(":") ? tag.slice(0, tag.indexOf(":")) : "Other";
    (groups[g] = groups[g] || []).push([tag, val]);
  }
  for (const g in groups) groups[g].sort((a, b) => a[0].localeCompare(b[0]));
  if (!groups[activeTab] && activeTab !== "All") activeTab = "All";
}

function renderTabs() {
  const names = ["All", ...Object.keys(groups).sort()];
  const total = Object.keys(allTags).length;
  $("tabs").innerHTML = names.map(n => {
    const c = n === "All" ? total : groups[n].length;
    return `<button class="tab${n === activeTab ? " on" : ""}" data-g="${escapeHtml(n)}">${escapeHtml(n)} <span>${c}</span></button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(t =>
    t.addEventListener("click", () => { activeTab = t.dataset.g; renderTabs(); renderTags($("search").value); }));
}

function tagKeyHTML(tag) {
  const i = tag.indexOf(":");
  if (i < 0) return escapeHtml(tag);
  return `<b>${escapeHtml(tag.slice(0, i))}:</b>${escapeHtml(tag.slice(i + 1))}`;
}

function renderTags(filter) {
  const q = (filter || "").toLowerCase();
  let entries = activeTab === "All"
    ? Object.keys(groups).sort().flatMap(g => groups[g])
    : (groups[activeTab] || []);
  entries = entries.filter(([tag, val]) =>
    !q || tag.toLowerCase().includes(q) || String(val).toLowerCase().includes(q));
  renderedRows = entries;
  $("tagcount").textContent = `${entries.length} of ${Object.keys(allTags).length} tags`;
  $("taglist").innerHTML = entries.length ? entries.map(([tag, val], i) => {
    const v = String(val);
    return `<div class="trow" data-i="${i}" title="Click to copy">` +
      `<div class="k">${tagKeyHTML(tag)}</div>` +
      `<div class="v${v ? "" : " empty"}">${v ? escapeHtml(v) : "—"}</div></div>`;
  }).join("") : `<div class="none">No matching tags.</div>`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function dmsToDecimal(v) {
  // `41 deg 52' 41.16" N` -> 41.8781  (exiftool reads GPS in DMS format)
  const m = v.match(/(\d+(?:\.\d+)?)\s*deg\s*(\d+(?:\.\d+)?)'\s*([\d.]+)"\s*([NSEW])/i);
  if (!m) return null;
  let dec = parseFloat(m[1]) + parseFloat(m[2]) / 60 + parseFloat(m[3]) / 3600;
  if (/[SW]/i.test(m[4])) dec = -dec;
  return String(Math.round(dec * 1e6) / 1e6);
}

function prefillForm() {
  document.querySelectorAll("[data-field]").forEach(input => {
    const field = input.dataset.field;
    input.value = "";
    for (const tag of (PREFILL[field] || [])) {
      if (allTags[tag] !== undefined && allTags[tag] !== "") {
        let v = String(allTags[tag]);
        if (field === "date_taken") {
          const m = v.match(/(\d{4}):(\d{2}):(\d{2})[ ](\d{2}):(\d{2})/);
          if (m) v = `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}`;
          else break;
        }
        if (field === "latitude" || field === "longitude") {
          const dec = dmsToDecimal(v);
          if (dec !== null) v = dec;
        }
        input.value = v;
        break;
      }
    }
  });
}

function collectFields() {
  const fields = {};
  document.querySelectorAll("[data-field]").forEach(input => { fields[input.dataset.field] = input.value; });
  return fields;
}

function showPreview(file) {
  const img = $("preview");
  if (previewURL) { URL.revokeObjectURL(previewURL); previewURL = null; }
  if (file.type.startsWith("image/")) {
    previewURL = URL.createObjectURL(file);
    img.src = previewURL;
    img.classList.remove("hidden");
  } else {
    img.classList.add("hidden");
  }
}

async function loadFile(file) {
  currentFile = file;
  setBusy(true);
  toast("Reading metadata…", "info");
  const fd = new FormData();
  fd.append("file", file);
  try {
    const res = await fetch("/api/metadata", { method: "POST", body: fd });
    const data = await res.json();
    if (data.error) { toast(data.error, "err"); return; }
    allTags = data.tags;
    activeTab = "All";
    $("search").value = "";
    buildGroups();
    renderTabs();
    renderTags("");
    prefillForm();
    $("filename").textContent = file.name;
    $("filemeta").textContent = `${data.count} tags · ${(file.size / 1024).toFixed(1)} KB`;
    showPreview(file);
    $("empty").classList.add("hidden");
    $("app").classList.remove("hidden");
    toast(`Loaded ${data.count} metadata tags.`, "ok");
  } catch (e) {
    toast("Could not reach the server.", "err");
  } finally {
    setBusy(false);
  }
}

async function postAndDownload(endpoint, extraForm) {
  if (!currentFile) return;
  setBusy(true);
  toast("Working…", "info");
  const fd = new FormData();
  fd.append("file", currentFile);
  if (extraForm) for (const [k, v] of Object.entries(extraForm)) fd.append(k, v);
  try {
    const res = await fetch(endpoint, { method: "POST", body: fd });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      toast(data.error || "Something went wrong.", "err");
      return;
    }
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = currentFile.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast("Done — your file has been downloaded.", "ok");
    loadFile(new File([blob], currentFile.name, { type: currentFile.type }));
  } catch (e) {
    toast("Could not reach the server.", "err");
  } finally {
    setBusy(false);
  }
}

// --- wiring ---
const fileinput = $("fileinput");
function pickFile(file) { if (file) loadFile(file); }
function makeDropzone(el) {
  el.addEventListener("click", () => fileinput.click());
  ["dragover","dragenter"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.add("over"); }));
  ["dragleave","drop"].forEach(ev => el.addEventListener(ev, e => { e.preventDefault(); el.classList.remove("over"); }));
  el.addEventListener("drop", e => pickFile(e.dataTransfer.files[0]));
}
makeDropzone($("drop"));
makeDropzone($("dropbar"));
fileinput.addEventListener("change", e => pickFile(e.target.files[0]));
$("search").addEventListener("input", e => renderTags(e.target.value));
$("newfile").addEventListener("click", () => fileinput.click());
$("save").addEventListener("click", () =>
  postAndDownload("/api/update", { fields: JSON.stringify(collectFields()) }));
$("strip").addEventListener("click", () => {
  if (confirm("Remove ALL metadata from this file? This cannot be undone."))
    postAndDownload("/api/strip");
});
$("taglist").addEventListener("click", e => {
  const row = e.target.closest(".trow");
  if (!row) return;
  const [tag, val] = renderedRows[+row.dataset.i];
  const text = `${tag}: ${val}`;
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(() => {
      const c = $("copied");
      c.classList.add("show");
      setTimeout(() => c.classList.remove("show"), 1200);
    })
    .catch(() => toast("Copy not available.", "err"));
});

// Health check on load.
fetch("/api/health").then(r => r.json()).then(h => {
  if (h.exiftool) {
    const v = $("ver");
    v.textContent = "ExifTool " + h.version;
    v.classList.remove("hidden");
  } else {
    toast("ExifTool was not found on this computer.", "err");
  }
});
</script>
</body>
</html>
