name: Build Windows exe

# Produces a single double-clickable exiftool-web.exe (Python + app +
# ExifTool bundled) and publishes it on the Releases page.
on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "requirements.txt"
      - "templates/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download ExifTool
        shell: pwsh
        run: |
          try {
            $html = (Invoke-WebRequest -Uri "https://exiftool.org/" -UseBasicParsing).Content
            $m = [regex]::Match($html, 'Version\s+(\d+\.\d+)')
            if ($m.Success) { $ver = $m.Groups[1].Value } else { $ver = "13.59" }
          } catch { $ver = "13.59" }
          # NOTE: use the 32-bit build - it is the canonical self-contained
          # PAR-packed exe. The 64-bit build needs an external perl5*.dll.
          $url = "https://sourceforge.net/projects/exiftool/files/exiftool-${ver}_32.zip/download"
          # curl.exe is far more reliable than Invoke-WebRequest for SourceForge.
          $ok = $false
          for ($i = 1; $i -le 5 -and -not $ok; $i++) {
            Write-Host "Download attempt $i of 5 ..."
            Remove-Item exiftool.zip -ErrorAction SilentlyContinue
            curl.exe -sSL --retry 3 --retry-all-errors --max-time 300 -o exiftool.zip $url
            try {
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              $z = [System.IO.Compression.ZipFile]::OpenRead("$PWD/exiftool.zip")
              $names = @($z.Entries | ForEach-Object { $_.Name })
              $z.Dispose()
              $ok = $names -contains "exiftool(-k).exe"
              if (-not $ok) { Write-Host "zip downloaded but exe entry missing" }
            } catch {
              Write-Host "zip validation failed, retrying..."
              Start-Sleep 5
            }
          }
          if (-not $ok) { throw "ExifTool download failed after 5 attempts" }
          Expand-Archive exiftool.zip -DestinationPath exiftool_dl -Force
          $exe = Get-ChildItem -Path exiftool_dl -Filter "exiftool*.exe" -Recurse |
                 Select-Object -First 1
          if (-not $exe) { throw "exiftool exe not found inside the zip" }
          Write-Host "Found: $($exe.FullName)"
          Move-Item $exe.FullName exiftool.exe
          .\exiftool.exe -ver

      - name: Build standalone exe
        shell: pwsh
        run: |
          pyinstaller --onefile --noconfirm --name exiftool-web `
            --add-data "templates;templates" `
            --add-binary "exiftool.exe;." `
            app.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ExifTool Web UI v1.0.${{ github.run_number }}
          body: |
            Download `exiftool-web.exe` below, double-click it - no Python or
            ExifTool install needed. Your browser opens automatically at
            http://127.0.0.1:5000. Close the black window to stop the app.

            Note: Windows SmartScreen may warn that the app is unrecognized
            (it isn't code-signed). Click "More info" -> "Run anyway".
          files: dist/exiftool-web.exe
